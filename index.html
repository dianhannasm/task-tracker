<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://fuaddary.github.io/Pemrograman-Web/assets/mock-api-kampus.js"></script>
    <script src="app.js" defer></script>
    <title>Task Tracker Kuliah</title>
</head>

<body>
    <main class="container">
        <section class="app">
            <h1>Task Tracker Kuliah</h1>

            <form id="form-tugas">
                <input type="text" id="judul" placeholder="Judul tugas (min. 3 karakter)">

                <select id="matkul">
                    <option value="Pemrograman Web">Pemrograman Web</option>
                    <option value="KJK">KJK</option>
                    <option value="Jaringan Komputer">Jaringan Komputer</option>
                    <option value="Ethical Hacking">Ethichal Hacking</option>
                    <option value="KomPro">Komunikasi Profesional</option>
                    <option value="IoT">IoT</option>
                </select>

                <input type="date" id="deadline">

                <button type="submit">Tambah</button>
            </form>

            <p id="pesan-form" role="status" aria-live="polite"></p>

            <div class="filter" id="filter">
                <button type="button" class="on" data-filter="semua">Semua</button>
                <button type="button" data-filter="aktif">Aktif</button>
                <button type="button" data-filter="selesai">Selesai</button>
            </div>

            <p id="ringkasan">Memuat tugas...</p>

            <div id="status" aria-live="polite">
                Memuat tugas...
            </div>

            <button type="button" id="ulang" hidden>
                Coba Lagi
            </button>

            <ul id="daftar"></ul>
        </section>
    </main>
</body>
</html>
